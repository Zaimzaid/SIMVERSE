name: simverse-earth-postgis

services:
  database:
    image: postgis/postgis:17-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EARTH_POSTGIS_DATABASE:?Set EARTH_POSTGIS_DATABASE}
      POSTGRES_USER: ${EARTH_POSTGIS_USER:?Set EARTH_POSTGIS_USER}
      POSTGRES_PASSWORD: ${EARTH_POSTGIS_PASSWORD:?Set EARTH_POSTGIS_PASSWORD}
    ports:
      - "127.0.0.1:${EARTH_POSTGIS_PORT:-55432}:5432"
    volumes:
      - earth_postgis_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  earth_postgis_data:
